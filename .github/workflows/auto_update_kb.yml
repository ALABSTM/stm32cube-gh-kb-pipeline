# ============================================================
# Automated KB Update - Runs every 2 weeks
# ============================================================
# This workflow keeps the ST GitHub Analyzer persona always up-to-date
# by re-ingesting GitHub data, preprocessing, and uploading to KB #793.
#
# Trigger: bi-weekly (1st and 15th of each month at 3:00 UTC)
#          + manual dispatch for on-demand runs
# ============================================================

name: Auto Update KB

on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      series:
        description: 'MCU series to process (comma-separated: f4,h5,h7,u5,wl)'
        required: false
        default: 'f4,h5,h7,u5,wl'
      skip_ingestion:
        description: 'Skip GitHub ingestion (reuse cached raw data)'
        type: boolean
        default: false
      skip_upload:
        description: 'Skip KB upload (dry-run mode)'
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ST_CHATGPT_API_KEY: ${{ secrets.ST_CHATGPT_API_KEY }}
  ST_REMOTE_USER: ${{ secrets.ST_REMOTE_USER }}

jobs:
  # ================================================================
  # JOB 1: Pipeline (runs on GitHub cloud)
  # ================================================================
  pipeline:
    name: Ingestion + Preprocessing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      series: ${{ steps.config.outputs.series }}
      skip_upload: ${{ steps.config.outputs.skip_upload }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine series
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "series=${{ github.event.inputs.series }}" >> $GITHUB_OUTPUT
            echo "skip_ingestion=${{ github.event.inputs.skip_ingestion }}" >> $GITHUB_OUTPUT
            echo "skip_upload=${{ github.event.inputs.skip_upload }}" >> $GITHUB_OUTPUT
          else
            echo "series=f4,h5,h7,u5,wl" >> $GITHUB_OUTPUT
            echo "skip_ingestion=false" >> $GITHUB_OUTPUT
            echo "skip_upload=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pipeline (all series)
        run: |
          IFS=',' read -ra SERIES <<< "${{ steps.config.outputs.series }}"
          ARGS="--series ${SERIES[*]} --export-st-ready --skip-chunking --continue-on-error"
          if [ "${{ steps.config.outputs.skip_ingestion }}" = "true" ]; then
            ARGS="$ARGS --skip-ingestion"
          fi
          python -m pipeline_Automation.workflow.run_all_series $ARGS

      - name: Upload delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: st-ready-delivery-${{ github.run_number }}
          path: datasets/07_delivery/st_ready/by_series/
          retention-days: 30

      - name: Pipeline summary
        run: |
          echo "## Pipeline Completed" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Series | ${{ steps.config.outputs.series }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date -u '+%Y-%m-%d %H:%M UTC') |" >> $GITHUB_STEP_SUMMARY

  # ================================================================
  # JOB 2: Upload to KB (self-hosted Windows runner with ST network)
  # ================================================================
  upload:
    name: Upload to KB #793
    needs: pipeline
    if: needs.pipeline.outputs.skip_upload != 'true'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Enable long paths
        shell: powershell
        run: git config --system core.longpaths true

      - name: Checkout (upload scripts only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline_Automation/upload
            shared

      - name: Verify Python
        run: python --version

      - name: Install requests
        run: pip install requests

      - name: Download delivery artifacts
        uses: actions/download-artifact@v4
        with:
          name: st-ready-delivery-${{ github.run_number }}
          path: st-ready/

      - name: Upload all series to KB
        
        run: |
          $series = "${{ needs.pipeline.outputs.series }}" -split ","
          $DS_ISSUES = @{ f4=28099; h5=28158; h7=19896; u5=28167; wl=28171 }
          $DS_FILES = @{ f4=28103; h5=28163; h7=21824; u5=28168; wl=28172 }
          $DS_RESOLVER = @{ f4=28118; h5=28164; h7=20403; u5=28244; wl=28245 }
          $DS_DIAGNOSTIC = @{ f4=28122; h5=28165; h7=23768; u5=28170; wl=28173 }

          $uploader = "pipeline_Automation/upload/Add_Data_Source_Files.py"

          foreach ($s in $series) {
            $base = "st-ready/stm32cube$s"
            if (-not $DS_ISSUES.ContainsKey($s)) {
              Write-Host "=== Skipping $($s.ToUpper()) (no datasource IDs) ==="
              continue
            }
            Write-Host "=== Uploading $($s.ToUpper()) ==="

            # Issues
            $f = "$base/issues_json/st_ready_issues_stm32cube$s.json"
            if (Test-Path $f) {
              python $uploader --kb 793 --operation add --datasource-id $($DS_ISSUES[$s]) --files $f --json-split-size 1000 --remote-user $env:ST_REMOTE_USER
            }
            # Files
            $f = "$base/files_json/st_ready_files_stm32cube$s.json"
            if (Test-Path $f) {
              python $uploader --kb 793 --operation add --datasource-id $($DS_FILES[$s]) --files $f --json-split-size 1000 --remote-user $env:ST_REMOTE_USER
            }
            # Resolver Cases
            $f = "$base/resolver_cases_json/st_ready_resolver_cases_stm32cube$s.json"
            if (Test-Path $f) {
              python $uploader --kb 793 --operation add --datasource-id $($DS_RESOLVER[$s]) --files $f --json-split-size 1000 --remote-user $env:ST_REMOTE_USER
            }
            # Diagnostic Cards
            $f = "$base/diagnostic_cards_json/st_ready_diagnostic_cards_stm32cube$s.json"
            if (Test-Path $f) {
              python $uploader --kb 793 --operation add --datasource-id $($DS_DIAGNOSTIC[$s]) --files $f --json-split-size 1000 --remote-user $env:ST_REMOTE_USER
            }
          }

      - name: Upload summary
        
        run: |
          "## KB Upload Complete" >> $env:GITHUB_STEP_SUMMARY
          "| Series | ${{ needs.pipeline.outputs.series }} |" >> $env:GITHUB_STEP_SUMMARY
          "| KB | #793 |" >> $env:GITHUB_STEP_SUMMARY
          "| Date | $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC |" >> $env:GITHUB_STEP_SUMMARY
