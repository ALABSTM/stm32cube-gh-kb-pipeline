name: Auto Update KB

on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
    inputs:
      series:
        description: 'Comma-separated series (G4,L0,L1,L4,L5,N6,U0,U3,WB,WB0,WBA,WL3)'
        required: false
        default: 'G4,L0,L1,L4,L5,N6,U0,U3,WB,WB0,WBA,WL3'
      mode:
        description: 'Execution mode for per-series script'
        type: choice
        required: false
        options:
          - Full
          - Prepare
          - Upload
        default: Full
      skip_drivers:
        description: 'Skip driver/subrepo uploads'
        type: boolean
        default: false
      skip_schema_validation:
        description: 'Skip schema validation gate'
        type: boolean
        default: false
      continue_on_workflow_error:
        description: 'Continue inside run_full_workflow when one repo fails'
        type: boolean
        default: false
      placeholder_policy:
        description: 'Policy for unresolved Alfred placeholders'
        type: choice
        required: false
        options:
          - Fail
          - Warn
          - Off
        default: Fail
      max_parallel:
        description: 'Maximum series jobs in parallel'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: auto-update-kb-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  DEFAULT_SERIES: 'G4,L0,L1,L4,L5,N6,U0,U3,WB,WB0,WBA,WL3'
  DEFAULT_MODE: 'Full'
  DEFAULT_PLACEHOLDER_POLICY: 'Fail'
  DEFAULT_MAX_PARALLEL: '1'

jobs:
  prepare:
    name: Prepare matrix inputs
    runs-on: ubuntu-latest
    outputs:
      series_json: ${{ steps.normalize.outputs.series_json }}
      mode: ${{ steps.normalize.outputs.mode }}
      skip_drivers: ${{ steps.normalize.outputs.skip_drivers }}
      skip_schema_validation: ${{ steps.normalize.outputs.skip_schema_validation }}
      continue_on_workflow_error: ${{ steps.normalize.outputs.continue_on_workflow_error }}
      placeholder_policy: ${{ steps.normalize.outputs.placeholder_policy }}
      max_parallel: ${{ steps.normalize.outputs.max_parallel }}
    steps:
      - name: Normalize workflow inputs
        id: normalize
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw_series='${{ inputs.series }}'
            mode='${{ inputs.mode }}'
            skip_drivers='${{ inputs.skip_drivers }}'
            skip_schema='${{ inputs.skip_schema_validation }}'
            continue_err='${{ inputs.continue_on_workflow_error }}'
            placeholder='${{ inputs.placeholder_policy }}'
            max_parallel='${{ inputs.max_parallel }}'
          else
            raw_series='${{ env.DEFAULT_SERIES }}'
            mode='${{ env.DEFAULT_MODE }}'
            skip_drivers='false'
            skip_schema='false'
            continue_err='false'
            placeholder='${{ env.DEFAULT_PLACEHOLDER_POLICY }}'
            max_parallel='${{ env.DEFAULT_MAX_PARALLEL }}'
          fi

          series_json=$(RAW_SERIES="$raw_series" python - <<'PY'
import json
import os

allowed = {
    "G4", "L0", "L1", "L4", "L5", "N6", "U0", "U3", "WB", "WB0", "WBA", "WL3"
}
raw = os.environ.get("RAW_SERIES", "")
items = [s.strip().upper() for s in raw.split(",") if s.strip()]

if not items:
    items = sorted(allowed)

seen = set()
normalized = []
for s in items:
    if s not in allowed:
        raise SystemExit(f"Unsupported series '{s}'. Allowed: {', '.join(sorted(allowed))}")
    if s in seen:
        continue
    seen.add(s)
    normalized.append(s)

print(json.dumps(normalized))
PY
)

          if [ -z "$max_parallel" ]; then
            max_parallel='1'
          fi

          echo "series_json=$series_json" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "skip_drivers=$skip_drivers" >> "$GITHUB_OUTPUT"
          echo "skip_schema_validation=$skip_schema" >> "$GITHUB_OUTPUT"
          echo "continue_on_workflow_error=$continue_err" >> "$GITHUB_OUTPUT"
          echo "placeholder_policy=$placeholder" >> "$GITHUB_OUTPUT"
          echo "max_parallel=$max_parallel" >> "$GITHUB_OUTPUT"

  run-series:
    name: ${{ format('Series {0} ({1})', matrix.series, needs.prepare.outputs.mode) }}
    needs: prepare
    runs-on: self-hosted
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        series: ${{ fromJSON(needs.prepare.outputs.series_json) }}
    env:
      ST_CHATGPT_API_KEY: ${{ secrets.ST_CHATGPT_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable long paths (Windows)
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run single-series full pipeline + upload
        shell: pwsh
        run: |
          $script = "pipeline_Automation/workflow/Run_Single_Series_Full_Pipeline_And_Upload.ps1"
          $args = @(
            "-Series", "${{ matrix.series }}",
            "-Mode", "${{ needs.prepare.outputs.mode }}",
            "-RemoteUser", "${{ secrets.ST_REMOTE_USER }}",
            "-KbId", "793",
            "-JsonSplitSize", "1000",
            "-PlaceholderPolicy", "${{ needs.prepare.outputs.placeholder_policy }}"
          )

          if ("${{ needs.prepare.outputs.skip_drivers }}" -eq "true") {
            $args += "-SkipDrivers"
          }
          if ("${{ needs.prepare.outputs.skip_schema_validation }}" -eq "true") {
            $args += "-SkipSchemaValidation"
          }
          if ("${{ needs.prepare.outputs.continue_on_workflow_error }}" -eq "true") {
            $args += "-ContinueOnWorkflowError"
          }

          & $script @args

      - name: Upload series artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: st-ready-${{ matrix.series }}-${{ github.run_number }}
          path: datasets/07_delivery/st_ready/by_series/
          if-no-files-found: warn
          retention-days: 30

      - name: Series summary
        if: always()
        shell: pwsh
        run: |
          "## Series ${{ matrix.series }}" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Parameter | Value |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| Mode | ${{ needs.prepare.outputs.mode }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Skip Drivers | ${{ needs.prepare.outputs.skip_drivers }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Skip Schema Validation | ${{ needs.prepare.outputs.skip_schema_validation }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Continue On Workflow Error | ${{ needs.prepare.outputs.continue_on_workflow_error }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Placeholder Policy | ${{ needs.prepare.outputs.placeholder_policy }} |" >> $env:GITHUB_STEP_SUMMARY
          "| Date | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K') |" >> $env:GITHUB_STEP_SUMMARY
