name: Smoke Test ST API Access

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: ST API endpoint
        required: false
        default: https://api-ai-bridge.st.com/chatgpt/api/client-apps
      client_app_name:
        description: ST client app name
        required: false
        default: mdrf_stgithub_analyzer_client
  push:
    branches:
      - PFE_Chatbot_STM32Cube_V2

permissions:
  contents: read

jobs:
  probe:
    name: Probe ST API from GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENDPOINT: ${{ inputs.endpoint || 'https://api-ai-bridge.st.com/chatgpt/api/client-apps' }}
      CLIENT_APP_NAME: ${{ inputs.client_app_name || 'mdrf_stgithub_analyzer_client' }}
      API_KEY: ${{ secrets.ST_CHATGPT_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preconditions
        shell: bash
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Missing secret ST_CHATGPT_API_KEY" >&2
            exit 1
          fi

      - name: DNS + TLS reachability
        shell: bash
        run: |
          set -euo pipefail
          host=$(python -c "from urllib.parse import urlparse; import os; print(urlparse(os.environ['ENDPOINT']).netloc)")

          echo "Probing host: $host"
          nslookup "$host" >/dev/null

          http_code=$(curl -k -sS -o /tmp/st_probe_headers.txt -w "%{http_code}" \
            --connect-timeout 20 \
            --max-time 40 \
            -I "$ENDPOINT")

          echo "HTTP code from HEAD probe: $http_code"
          if [ "$http_code" = "000" ]; then
            echo "Network reachability failed from GitHub-hosted runner." >&2
            exit 2
          fi

      - name: Authenticated API probe
        shell: bash
        run: |
          python .github/scripts/smoke_test_st_api.py

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## ST API Smoke Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Endpoint | $ENDPOINT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Client app | $CLIENT_APP_NAME |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner | github-hosted (ubuntu-latest) |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Interpretation:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Success => GitHub Cloud can access ST API directly (self-hosted runner not required for this path)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth failure (401/403) => network is reachable, but API key/policy must be fixed for cloud origin." >> "$GITHUB_STEP_SUMMARY"
          echo "- Network failure => keep self-hosted or use ST bridge webhook." >> "$GITHUB_STEP_SUMMARY"
